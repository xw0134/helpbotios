name: Test AAR - AGP 8.0 (First AGP 8)

on:
  push:
    branches: [ ci/ios-actions-gha ]
  pull_request:
    branches: [ ci/ios-actions-gha ]
  workflow_dispatch:

jobs:
  test-agp-8-0:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build HelpBot AAR
      run: |
        
        ./gradlew :HelpBot:assembleRelease --stacktrace
        
    - name: Copy AAR to test directory
      run: |
        mkdir -p test/aar
        cp HelpBot/build/outputs/aar/HelpBot-release.aar test/aar/
        
    - name: Configure test environment for AGP 8.0
      run: |
        cd test
        
        # Create build.gradle for AGP 8.0
        cat > build.gradle << 'EOF'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.0.0'
            }
        }
        EOF
        
        # Create settings.gradle
        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        
        rootProject.name = "HelpBot-AAR-Test-AGP8.0"
        include ':app2'
        EOF
        
        # Update app2/build.gradle to use Groovy DSL
        cat > app2/build.gradle << 'EOF'
        plugins {
            id 'com.android.application'
        }
        
        android {
            namespace 'com.example.sdk_webview_test'
            compileSdk 33
            
            defaultConfig {
                applicationId "com.example.sdk_webview_test"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
            
            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_11
                targetCompatibility JavaVersion.VERSION_11
            }
        }
        
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.activity:activity:1.7.2'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'com.squareup.okhttp3:okhttp:5.0.0-alpha.11'
            implementation files('../aar/HelpBot-release.aar')
        }
        EOF
        
        # Use Gradle 8.0
        sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties
        
    - name: Build test app with AAR (AGP 8.0)
      run: |
        cd test
        ./gradlew :app2:assembleDebug --stacktrace
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app2-debug-agp8.0
        path: test/app2/build/outputs/apk/debug/*.apk
        retention-days: 30
