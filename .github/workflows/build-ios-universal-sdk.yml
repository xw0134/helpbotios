name: Build iOS Universal SDK (HelpBotSDK + HelpBotBridge)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Debug
          - Release
  push:
    branches:
      - main
      - develop
      - "ci/**"
    paths:
      - "SDK/iOS/HelpBotSDK/**"
      - "SDK/iOS/HelpBotSDK.xcframework/**"
      - "SDK/iOSBridgeBuild/**"
      - "SDK/Unity/HelpBotUnityPackage/Assets/HelpBotSDK/Runtime/Platform/iOS/**"
      - "SDK/Unity/HelpBotUnityPackage/Assets/HelpBotSDK/Editor/**"
      - ".github/workflows/build-ios-universal-sdk.yml"
  pull_request:
    paths:
      - "SDK/iOS/HelpBotSDK/**"
      - "SDK/iOS/HelpBotSDK.xcframework/**"
      - "SDK/iOSBridgeBuild/**"
      - "SDK/Unity/HelpBotUnityPackage/Assets/HelpBotSDK/Runtime/Platform/iOS/**"
      - "SDK/Unity/HelpBotUnityPackage/Assets/HelpBotSDK/Editor/**"
      - ".github/workflows/build-ios-universal-sdk.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔍 显示环境信息
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: 🍺 安装 xcodegen（用于桥接库工程生成）
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew update
            brew install xcodegen
          fi
          xcodegen --version

      - name: 🔨 构建 HelpBotSDK.xcframework（从源码）
        run: |
          set -euo pipefail
          OUT_DIR="SDK/Artifacts/iOS"
          mkdir -p "${OUT_DIR}"
          OUT_XCFRAMEWORK="${OUT_DIR}/HelpBotSDK.xcframework"
          bash SDK/Unity/iOSBuild/build_helpbot_sdk_xcframework.sh "${OUT_XCFRAMEWORK}"

      - name: 🔨 构建 HelpBotBridge.xcframework（通用 C-ABI 桥接库）
        run: |
          set -euo pipefail
          SDK_XC="SDK/Artifacts/iOS/HelpBotSDK.xcframework"
          bash SDK/iOS/HelpBotBridgeBuild/build_bridge_xcframework.sh "${SDK_XC}" "SDK/Artifacts/iOS"

      - name: 🔍 校验产物结构与关键符号
        run: |
          set -euo pipefail

          echo "=== 校验 HelpBotSDK Headers/Modules ==="
          ls -la SDK/Artifacts/iOS/HelpBotSDK.xcframework/ios-arm64/HelpBotSDK.framework/Headers
          ls -la SDK/Artifacts/iOS/HelpBotSDK.xcframework/ios-arm64/HelpBotSDK.framework/Modules
          if ! find "SDK/Artifacts/iOS/HelpBotSDK.xcframework/ios-arm64/HelpBotSDK.framework/Headers" -maxdepth 1 -type f -name "*.h" | grep -q .; then
            echo "❌ HelpBotSDK Headers 为空（真机）"
            exit 1
          fi
          if [ ! -d "SDK/Artifacts/iOS/HelpBotSDK.xcframework/ios-arm64/HelpBotSDK.framework/Modules/HelpBotSDK.swiftmodule" ]; then
            echo "❌ HelpBotSDK 缺少 swiftmodule（真机）"
            exit 1
          fi

          echo "=== 校验 HelpBotBridge 导出符号（真机） ==="
          BRIDGE_BIN="SDK/Artifacts/iOS/HelpBotBridge.xcframework/ios-arm64/HelpBotBridge.framework/HelpBotBridge"
          if [ ! -f "${BRIDGE_BIN}" ]; then
            echo "❌ 找不到 HelpBotBridge 二进制：${BRIDGE_BIN}"
            exit 1
          fi

          nm -gU "${BRIDGE_BIN}" | grep "hb_bridge_install" >/dev/null
          nm -gU "${BRIDGE_BIN}" | grep "hb_bridge_login" >/dev/null
          nm -gU "${BRIDGE_BIN}" | grep "hb_bridge_set_callbacks" >/dev/null
          nm -gU "${BRIDGE_BIN}" | grep "hb_bridge_getSdkVersion" >/dev/null
          echo "✅ 符号校验通过"

      - name: 📦 打包通用 SDK（仅二进制）
        run: |
          set -euo pipefail
          OUT_DIR="SDK/Artifacts/iOS"
          PKG_DIR="${OUT_DIR}/HelpBot_iOS_Universal_${CONFIGURATION}"
          rm -rf "${PKG_DIR}"
          mkdir -p "${PKG_DIR}"

          cp -R "${OUT_DIR}/HelpBotSDK.xcframework" "${PKG_DIR}/HelpBotSDK.xcframework"
          cp -R "${OUT_DIR}/HelpBotBridge.xcframework" "${PKG_DIR}/HelpBotBridge.xcframework"
          cp -R "SDK/iOS/HelpBotBridgeBuild/README.md" "${PKG_DIR}/HelpBotBridge_README.md"
          # 新路径（整合进 SDK/iOS 目录后）
          if [ -f "SDK/iOS/HelpBotBridgeBuild/README.md" ]; then
            cp -R "SDK/iOS/HelpBotBridgeBuild/README.md" "${PKG_DIR}/HelpBotBridge_README.md"
          fi

          cat > "${PKG_DIR}/README.md" << EOF
          HelpBot iOS Universal SDK Package
          - configuration: ${CONFIGURATION}
          - commit: ${{ github.sha }}
          - time: $(date)

          Contents:
          - HelpBotSDK.xcframework
          - HelpBotBridge.xcframework (C ABI)
          EOF

          (cd "${OUT_DIR}" && rm -f "HelpBot_iOS_Universal_${CONFIGURATION}.zip" && zip -r "HelpBot_iOS_Universal_${CONFIGURATION}.zip" "HelpBot_iOS_Universal_${CONFIGURATION}")

      - name: ⬆️ 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: HelpBot-iOS-Universal-${{ env.CONFIGURATION }}-${{ github.sha }}
          path: |
            SDK/Artifacts/iOS/HelpBot_iOS_Universal_${{ env.CONFIGURATION }}.zip
            SDK/Artifacts/iOS/HelpBotSDK.xcframework
            SDK/Artifacts/iOS/HelpBotBridge.xcframework
          if-no-files-found: error

      - name: ✨ 生成作业摘要
        if: always()
        run: |
          echo "## 🍏 HelpBot iOS Universal SDK 构建摘要" >> $GITHUB_STEP_SUMMARY
          echo "- **配置**: ${{ env.CONFIGURATION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **提交**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 产物列表" >> $GITHUB_STEP_SUMMARY
          echo "- HelpBotSDK.xcframework" >> $GITHUB_STEP_SUMMARY
          echo "- HelpBotBridge.xcframework" >> $GITHUB_STEP_SUMMARY
          echo "✅ 所有校验已通过" >> $GITHUB_STEP_SUMMARY

