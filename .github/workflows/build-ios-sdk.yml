name: Build iOS SDK (XCFramework)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Debug
          - Release
  push:
    branches:
      - main
      - develop
    paths:
      - "SDK/iOS/HelpBotSDK/**"
      - "SDK/iOS/build_local.sh"
      - ".github/workflows/build-ios-sdk.yml"
  pull_request:
    paths:
      - "SDK/iOS/HelpBotSDK/**"
      - "SDK/iOS/build_local.sh"
      - ".github/workflows/build-ios-sdk.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔍 显示环境信息
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: 🔨 编译并打包 XCFramework
        working-directory: SDK/iOS/HelpBotSDK
        run: |
          export CONFIGURATION="${CONFIGURATION}"
          bash ../build_local.sh

      - name: ⬆️ 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: HelpBotSDK-${{ env.CONFIGURATION }}-${{ github.sha }}
          path: |
            SDK/iOS/HelpBotSDK/build/HelpBotSDK.xcframework.zip
            SDK/iOS/HelpBotSDK/build/build-report.txt
          if-no-files-found: error
name: Build iOS SDK
"on":
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration (Release/Debug)
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
  push:
    paths:
      - "SDK/iOS/HelpBotSDK/**"
      - "SDK/iOS/build_local.sh"
      - ".github/workflows/build-ios-sdk.yml"
  pull_request:
    paths:
      - "SDK/iOS/HelpBotSDK/**"
      - "SDK/iOS/build_local.sh"
      - ".github/workflows/build-ios-sdk.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print toolchain versions
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build XCFramework (HelpBotSDK)
        env:
          CONFIGURATION: ${{ inputs.configuration || 'Release' }}
        run: |
          set -euo pipefail
          chmod +x SDK/iOS/build_local.sh
          cd SDK/iOS/HelpBotSDK
          ../build_local.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HelpBotSDK-${{ inputs.configuration || 'Release' }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            SDK/iOS/HelpBotSDK/build/HelpBotSDK.xcframework.zip
            SDK/iOS/HelpBotSDK/build/build-report.txt


