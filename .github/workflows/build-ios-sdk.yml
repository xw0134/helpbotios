name: Build iOS SDK

on:
  workflow_call:
    inputs:
      configuration:
        description: Build configuration (Debug/Release)
        required: false
        default: Release
        type: string
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration (Debug/Release)
        required: true
        default: Release
        type: choice
        options:
          - Debug
          - Release
  push:
    branches:
      - main
      - develop
      - "ci/**"
    paths:
      - "SDK/iOS/HelpBotSDK/**"
      - "SDK/iOS/build_sdk.sh"
      - "SDK/iOS/build_local.sh"
      - ".github/workflows/build-ios-sdk.yml"
  pull_request:
    paths:
      - "SDK/iOS/HelpBotSDK/**"
      - "SDK/iOS/build_sdk.sh"
      - "SDK/iOS/build_local.sh"
      - ".github/workflows/build-ios-sdk.yml"

jobs:
  build-ios-sdk:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.2"

      - name: Show versions
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Verify build scripts (anti-cache / anti-old-commit)
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=${GITHUB_SHA}"
          git rev-parse HEAD
          echo "==== build_sdk.sh key lines (must contain DerivedData + Modules/Headers validation) ===="
          sed -n '1,80p' SDK/iOS/build_sdk.sh
          sed -n '160,260p' SDK/iOS/build_sdk.sh
          sed -n '260,360p' SDK/iOS/build_sdk.sh

      - name: Build HelpBotSDK.xcframework
        working-directory: SDK/iOS
        run: |
          set -euo pipefail
          chmod +x ./build_sdk.sh
          bash ./build_sdk.sh

      - name: Upload artifacts (xcframework + report)
        uses: actions/upload-artifact@v4
        with:
          name: HelpBotSDK-${{ github.sha }}
          path: |
            SDK/iOS/build/HelpBotSDK.xcframework.zip
            SDK/iOS/build/build-report.txt
          if-no-files-found: error
          retention-days: 30
