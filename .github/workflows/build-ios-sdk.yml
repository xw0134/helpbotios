name: Build iOS SDK

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      build_configuration:
        description: '编译配置'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
  
  # 代码推送时自动触发
  push:
    branches:
      - main
      - develop
    paths:
      - 'SDK/iOS/HelpBotSDK/**'
      - '.github/workflows/build-ios-sdk.yml'
  
  # PR时触发
  pull_request:
    paths:
      - 'SDK/iOS/HelpBotSDK/**'

jobs:
  build-ios-sdk:
    name: 编译 iOS SDK
    runs-on: macos-14  # 使用最新的 macOS runner (支持 Xcode 15+)
    
    env:
      SCHEME: HelpBotSDK
      SDK_PATH: SDK/iOS/HelpBotSDK
      BUILD_DIR: build
      CONFIGURATION: ${{ github.event.inputs.build_configuration || 'Release' }}
    
    steps:
      # 1. 检出代码
      - name: 📥 检出代码
        uses: actions/checkout@v4
      
      # 2. 显示环境信息
      - name: 🔍 显示环境信息
        run: |
          echo "=== 系统信息 ==="
          sw_vers
          echo ""
          echo "=== Xcode 版本 ==="
          xcodebuild -version
          echo ""
          echo "=== Swift 版本 ==="
          swift --version
          echo ""
          echo "=== 可用的 SDK ==="
          xcodebuild -showsdks
      
      # 3. 选择 Xcode 版本
      - name: ⚙️ 选择 Xcode 版本
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.2.app
          xcodebuild -version
      
      # 4. 清理旧的编译产物
      - name: 🧹 清理旧的编译产物
        working-directory: ${{ env.SDK_PATH }}
        run: |
          rm -rf ${{ env.BUILD_DIR }}
          rm -rf .build
          echo "✅ 清理完成"
      
      # 5. 编译 iOS 真机架构
      - name: 🔨 编译 iOS 真机架构 (arm64)
        working-directory: ${{ env.SDK_PATH }}
        run: |
          echo "开始编译 iOS 真机架构..."
          xcodebuild archive \
            -scheme ${{ env.SCHEME }} \
            -destination "generic/platform=iOS" \
            -archivePath "${{ env.BUILD_DIR }}/ios.xcarchive" \
            -configuration ${{ env.CONFIGURATION }} \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            ONLY_ACTIVE_ARCH=NO
          echo "✅ iOS 真机架构编译完成"
      
      # 6. 编译 iOS 模拟器架构
      - name: 🔨 编译 iOS 模拟器架构 (x86_64, arm64)
        working-directory: ${{ env.SDK_PATH }}
        run: |
          echo "开始编译 iOS 模拟器架构..."
          xcodebuild archive \
            -scheme ${{ env.SCHEME }} \
            -destination "generic/platform=iOS Simulator" \
            -archivePath "${{ env.BUILD_DIR }}/ios-simulator.xcarchive" \
            -configuration ${{ env.CONFIGURATION }} \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            ONLY_ACTIVE_ARCH=NO
          echo "✅ iOS 模拟器架构编译完成"
      
      # 7. 创建 XCFramework
      - name: 📦 创建 XCFramework
        working-directory: ${{ env.SDK_PATH }}
        run: |
          echo "开始创建 XCFramework..."
          xcodebuild -create-xcframework \
            -framework "${{ env.BUILD_DIR }}/ios.xcarchive/Products/Library/Frameworks/${{ env.SCHEME }}.framework" \
            -framework "${{ env.BUILD_DIR }}/ios-simulator.xcarchive/Products/Library/Frameworks/${{ env.SCHEME }}.framework" \
            -output "${{ env.BUILD_DIR }}/${{ env.SCHEME }}.xcframework"
          echo "✅ XCFramework 创建完成"
      
      # 8. 验证 XCFramework
      - name: ✅ 验证 XCFramework
        working-directory: ${{ env.SDK_PATH }}
        run: |
          echo "=== XCFramework 结构 ==="
          ls -lR "${{ env.BUILD_DIR }}/${{ env.SCHEME }}.xcframework"
          echo ""
          echo "=== 验证架构 ==="
          # 检查 iOS 真机架构
          echo "iOS 真机架构:"
          lipo -info "${{ env.BUILD_DIR }}/${{ env.SCHEME }}.xcframework/ios-arm64/${{ env.SCHEME }}.framework/${{ env.SCHEME }}"
          echo ""
          # 检查 iOS 模拟器架构
          echo "iOS 模拟器架构:"
          lipo -info "${{ env.BUILD_DIR }}/${{ env.SCHEME }}.xcframework/ios-arm64_x86_64-simulator/${{ env.SCHEME }}.framework/${{ env.SCHEME }}"
          echo ""
          echo "✅ XCFramework 验证通过"
      
      # 9. 生成编译报告
      - name: 📄 生成编译报告
        working-directory: ${{ env.SDK_PATH }}
        run: |
          REPORT_FILE="${{ env.BUILD_DIR }}/build-report.txt"
          echo "=== HelpBot iOS SDK 编译报告 ===" > $REPORT_FILE
          echo "" >> $REPORT_FILE
          echo "编译时间: $(date)" >> $REPORT_FILE
          echo "编译配置: ${{ env.CONFIGURATION }}" >> $REPORT_FILE
          echo "Git Commit: ${{ github.sha }}" >> $REPORT_FILE
          echo "Git Branch: ${{ github.ref_name }}" >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          echo "=== 环境信息 ===" >> $REPORT_FILE
          sw_vers >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          xcodebuild -version >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          swift --version >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          echo "=== XCFramework 信息 ===" >> $REPORT_FILE
          ls -lh "${{ env.BUILD_DIR }}/${{ env.SCHEME }}.xcframework" >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          echo "=== 架构信息 ===" >> $REPORT_FILE
          echo "iOS 真机:" >> $REPORT_FILE
          lipo -info "${{ env.BUILD_DIR }}/${{ env.SCHEME }}.xcframework/ios-arm64/${{ env.SCHEME }}.framework/${{ env.SCHEME }}" >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          echo "iOS 模拟器:" >> $REPORT_FILE
          lipo -info "${{ env.BUILD_DIR }}/${{ env.SCHEME }}.xcframework/ios-arm64_x86_64-simulator/${{ env.SCHEME }}.framework/${{ env.SCHEME }}" >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          echo "✅ 编译报告生成完成"
          cat $REPORT_FILE
      
      # 10. 打包 XCFramework
      - name: 📦 打包 XCFramework
        working-directory: ${{ env.SDK_PATH }}
        run: |
          cd ${{ env.BUILD_DIR }}
          zip -r ${{ env.SCHEME }}.xcframework.zip ${{ env.SCHEME }}.xcframework
          echo "✅ XCFramework 打包完成"
          ls -lh ${{ env.SCHEME }}.xcframework.zip
      
      # 11. 上传 XCFramework 为 Artifact
      - name: 📤 上传 XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: HelpBotSDK-${{ env.CONFIGURATION }}-${{ github.sha }}
          path: |
            ${{ env.SDK_PATH }}/${{ env.BUILD_DIR }}/${{ env.SCHEME }}.xcframework.zip
            ${{ env.SDK_PATH }}/${{ env.BUILD_DIR }}/build-report.txt
          retention-days: 30
      
      # 12. 输出下载链接
      - name: 📋 编译成功总结
        run: |
          echo "🎉 iOS SDK 编译成功!"
          echo ""
          echo "📦 编译产物:"
          echo "  - HelpBotSDK.xcframework.zip"
          echo "  - build-report.txt"
          echo ""
          echo "📥 下载方式:"
          echo "  1. 访问 Actions 页面: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "  2. 在 Artifacts 区域下载编译产物"
          echo ""
          echo "✅ 编译配置: ${{ env.CONFIGURATION }}"
          echo "✅ Git Commit: ${{ github.sha }}"
