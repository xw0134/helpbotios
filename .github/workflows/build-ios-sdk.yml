name: Build iOS SDK

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Debug
          - Release
  push:
    branches:
      - main
      - develop
    paths:
      - "SDK/iOS/HelpBotSDK/**"
      - "SDK/iOS/build_sdk.sh"
      - ".github/workflows/build-ios-sdk.yml"
  pull_request:
    paths:
      - "SDK/iOS/HelpBotSDK/**"
      - "SDK/iOS/build_sdk.sh"
      - ".github/workflows/build-ios-sdk.yml"

concurrency:
  group: ios-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ github.event.inputs.configuration || 'Release' }})
    runs-on: macos-14
    timeout-minutes: 30

    env:
      CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install xcpretty (optional)
        run: |
          set -euo pipefail
          sudo gem install xcpretty --no-document || true

      - name: Build HelpBotSDK.xcframework
        run: |
          set -euo pipefail
          chmod +x SDK/iOS/build_sdk.sh
          bash SDK/iOS/build_sdk.sh

      - name: Write Job Summary
        if: always()
        run: |
          set -euo pipefail
          echo "## HelpBot iOS SDK - Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Configuration**: \`${CONFIGURATION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "SDK/iOS/build/build-report.txt" ]; then
            echo "### build-report.txt" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,200p' SDK/iOS/build/build-report.txt >> "$GITHUB_STEP_SUMMARY" || true
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- build-report.txt not found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HelpBotSDK-${{ env.CONFIGURATION }}-${{ github.sha }}
          path: |
            SDK/iOS/build/HelpBotSDK.xcframework.zip
            SDK/iOS/build/build-report.txt
          if-no-files-found: error
          retention-days: 30

name: Build iOS SDK

on:
  workflow_call:
    inputs:
      configuration:
        description: Build configuration (Debug/Release)
        required: false
        default: Release
        type: string
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration (Debug/Release)
        required: true
        default: Release
        type: choice
        options:
          - Debug
          - Release
  push:
    branches:
      - main
      - develop
      - "ci/**"
    paths:
      - "SDK/iOS/HelpBotSDK/**"
      - "SDK/iOS/build_sdk.sh"
      - ".github/workflows/build-ios-sdk.yml"
  pull_request:
    paths:
      - "SDK/iOS/HelpBotSDK/**"
      - "SDK/iOS/build_sdk.sh"
      - ".github/workflows/build-ios-sdk.yml"

jobs:
  build-ios-sdk:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.2"

      - name: Show versions
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Verify build scripts (anti-cache / anti-old-commit)
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=${GITHUB_SHA}"
          git rev-parse HEAD
          echo "==== build_sdk.sh key lines (must contain DerivedData + Modules/Headers validation) ===="
          sed -n '1,80p' SDK/iOS/build_sdk.sh
          sed -n '160,260p' SDK/iOS/build_sdk.sh
          sed -n '260,360p' SDK/iOS/build_sdk.sh

      - name: Build HelpBotSDK.xcframework
        working-directory: SDK/iOS
        run: |
          set -euo pipefail
          chmod +x ./build_sdk.sh
          bash ./build_sdk.sh

      - name: Upload artifacts (xcframework + report)
        uses: actions/upload-artifact@v4
        with:
          name: HelpBotSDK-${{ github.sha }}
          path: |
            SDK/iOS/build/HelpBotSDK.xcframework.zip
            SDK/iOS/build/build-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Generate Job Summary
        if: always()
        run: |
          echo "## 🚀 HelpBot iOS SDK Build Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f SDK/iOS/build/build-report.txt ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat SDK/iOS/build/build-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build report not found!" >> $GITHUB_STEP_SUMMARY
          fi
