name: Test AAR - AGP 4.0 (First AGP 4)

on:
  push:
    branches: [ ci/ios-actions-gha ]
  pull_request:
    branches: [ ci/ios-actions-gha ]
  workflow_dispatch:

jobs:
  test-agp-4-0:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build HelpBot AAR
      run: |
        
        ./gradlew :HelpBot:assembleRelease --stacktrace
        
    - name: Copy AAR to test directory
      run: |
        mkdir -p test/aar
        cp HelpBot/build/outputs/aar/HelpBot-release.aar test/aar/
        
    - name: Configure test environment for AGP 4.0
      run: |
        cd test
        
        # Create build.gradle for AGP 4.0
        cat > build.gradle << 'EOF'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:4.0.0'
            }
        }
        
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF
        
        # Create settings.gradle
        cat > settings.gradle << 'EOF'
        rootProject.name = "HelpBot-AAR-Test-AGP4.0"
        include ':app2'
        EOF
        
        # Update app2/build.gradle
        cat > app2/build.gradle << 'EOF'
        apply plugin: 'com.android.application'
        
        android {
            compileSdkVersion 29
            
            defaultConfig {
                applicationId "com.example.sdk_webview_test"
                minSdkVersion 21
                targetSdkVersion 29
                versionCode 1
                versionName "1.0"
            }
            
            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }
        
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.2.0'
            implementation 'com.google.android.material:material:1.2.1'
            implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
            implementation 'com.squareup.okhttp3:okhttp:4.8.1'
            implementation files('../aar/HelpBot-release.aar')
        }
        EOF
        
        # Add AndroidManifest.xml
        mkdir -p app2/src/main
        cat > app2/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.sdk_webview_test">
            
            <uses-permission android:name="android.permission.INTERNET" />
            
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="HelpBot Test"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                <activity android:name=".MainActivity">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # Use Gradle 6.1.1
        sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-6.1.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
        
    - name: Build test app with AAR (AGP 4.0)
      run: |
        cd test
        ./gradlew :app2:assembleDebug --stacktrace
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app2-debug-agp4.0
        path: test/app2/build/outputs/apk/debug/*.apk
        retention-days: 30
