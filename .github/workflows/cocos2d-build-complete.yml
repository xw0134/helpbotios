name: Cocos2d Multi-Platform Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'SDK/Cocos2d/**'
      - '.github/workflows/cocos2d-build-complete.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android'
        required: false
        default: true
        type: boolean
      build_ios:
        description: 'Build iOS'
        required: false
        default: true
        type: boolean

jobs:
  build-android:
    name: Build Cocos2d Android
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.build_android != 'false' }}
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
      
      - name: 安装 NDK
        run: |
          echo "y" | sdkmanager "ndk;25.1.8937393"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> $GITHUB_ENV
      
      - name: 安装 CMake
        run: |
          echo "y" | sdkmanager "cmake;3.22.1"
      
      - name: 克隆 Cocos2d-x 引擎 (如果需要)
        run: |
          if [ ! -d "SDK/Cocos2d/cocos2d" ]; then
            echo "Cloning Cocos2d-x engine..."
            cd SDK/Cocos2d
            git clone --depth 1 --branch v3.17.2 https://github.com/cocos2d/cocos2d-x.git cocos2d
          else
            echo "Cocos2d-x engine already exists"
          fi
      
      - name: 授予 Gradle 执行权限
        working-directory: SDK/Cocos2d/proj.android
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi
      
      - name: 构建 Android APK
        working-directory: SDK/Cocos2d/proj.android
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            echo "gradlew not found"
            exit 1
          fi
      
      - name: 上传 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Cocos2d-Android-APK
          path: SDK/Cocos2d/proj.android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      
      - name: 生成构建报告
        if: always()
        run: |
          echo "## Cocos2d Android 构建完成" >> $GITHUB_STEP_SUMMARY
          if [ -f "SDK/Cocos2d/proj.android/app/build/outputs/apk/release/app-release.apk" ]; then
            APK_SIZE=$(du -h SDK/Cocos2d/proj.android/app/build/outputs/apk/release/app-release.apk | cut -f1)
            echo "✅ APK 大小: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ APK 构建失败" >> $GITHUB_STEP_SUMMARY
          fi

  build-ios:
    name: Build Cocos2d iOS
    runs-on: macos-latest
    if: ${{ github.event.inputs.build_ios != 'false' }}
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: 选择 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
      
      - name: 安装 CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version
      
      - name: 克隆 Cocos2d-x 引擎 (如果需要)
        run: |
          if [ ! -d "SDK/Cocos2d/cocos2d" ]; then
            echo "Cloning Cocos2d-x engine..."
            cd SDK/Cocos2d
            git clone --depth 1 --branch v3.17.2 https://github.com/cocos2d/cocos2d-x.git cocos2d
          else
            echo "Cocos2d-x engine already exists"
          fi
      
      - name: 安装 Pod 依赖 (如果有 Podfile)
        working-directory: SDK/Cocos2d/proj.ios_mac
        run: |
          if [ -f "Podfile" ]; then
            pod install
          else
            echo "No Podfile found, skipping pod install"
          fi
      
      - name: 构建 iOS 模拟器版本
        working-directory: SDK/Cocos2d/proj.ios_mac
        run: |
          # 查找 workspace 或 project
          if [ -f "*.xcworkspace" ]; then
            WORKSPACE=$(ls *.xcworkspace | head -n 1)
            xcodebuild build \
              -workspace "$WORKSPACE" \
              -scheme HelpBotCocos \
              -configuration Release \
              -destination "generic/platform=iOS Simulator" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          elif [ -f "*.xcodeproj" ]; then
            PROJECT=$(ls *.xcodeproj | head -n 1)
            xcodebuild build \
              -project "$PROJECT" \
              -scheme HelpBotCocos \
              -configuration Release \
              -destination "generic/platform=iOS Simulator" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "No Xcode project or workspace found"
            exit 1
          fi
      
      - name: 打包 iOS App
        working-directory: SDK/Cocos2d/proj.ios_mac
        run: |
          mkdir -p build
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "HelpBotCocos.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            mkdir -p build/Payload
            cp -R "$APP_PATH" build/Payload/
            cd build
            zip -r HelpBotCocos-iOS-Simulator.ipa Payload
            echo "✅ IPA created successfully"
          else
            echo "⚠️ App not found, creating placeholder"
            echo "iOS build completed but app not packaged" > build/build_log.txt
          fi
      
      - name: 上传 iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cocos2d-iOS-IPA
          path: |
            SDK/Cocos2d/proj.ios_mac/build/HelpBotCocos-iOS-Simulator.ipa
            SDK/Cocos2d/proj.ios_mac/build/build_log.txt
          if-no-files-found: warn
      
      - name: 生成构建报告
        if: always()
        run: |
          echo "## Cocos2d iOS 构建完成" >> $GITHUB_STEP_SUMMARY
          if [ -f "SDK/Cocos2d/proj.ios_mac/build/HelpBotCocos-iOS-Simulator.ipa" ]; then
            IPA_SIZE=$(du -h SDK/Cocos2d/proj.ios_mac/build/HelpBotCocos-iOS-Simulator.ipa | cut -f1)
            echo "✅ IPA 大小: $IPA_SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ IPA 打包可能失败,请查看日志" >> $GITHUB_STEP_SUMMARY
          fi
