name: Build iOS Demo (IPA)
"on":
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration (Debug/Release)
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release
  push:
    paths:
      - "SDK/iOS/HelpBotDemo/**"
      - "SDK/iOS/HelpBotSDK/**"
      - ".github/workflows/build-ios-demo.yml"
  pull_request:
    paths:
      - "SDK/iOS/HelpBotDemo/**"
      - "SDK/iOS/HelpBotSDK/**"
      - ".github/workflows/build-ios-demo.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      DEMO_DIR: SDK/iOS/HelpBotDemo
      PROJECT: HelpBotDemo.xcodeproj
      SCHEME: HelpBotDemo
      CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
      DERIVED_DATA: build/DerivedData
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print toolchain versions
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "Repo root listing:"
          ls -la

      - name: Resolve SwiftPM dependencies
        run: |
          set -euo pipefail
          PROJECT_PATH="$GITHUB_WORKSPACE/$DEMO_DIR/$PROJECT"
          echo "DEMO_DIR=$DEMO_DIR"
          echo "PROJECT_PATH=$PROJECT_PATH"
          echo "Demo dir listing:"
          ls -la "$GITHUB_WORKSPACE/$DEMO_DIR" || true
          echo "Project listing:"
          ls -la "$PROJECT_PATH" || true
          if [[ ! -d "$PROJECT_PATH" ]]; then
            echo "❌ Xcode project not found: $PROJECT_PATH"
            exit 1
          fi
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME"

      - name: Build (iOS Simulator, no codesign)
        run: |
          set -euo pipefail
          PROJECT_PATH="$GITHUB_WORKSPACE/$DEMO_DIR/$PROJECT"
          echo "PROJECT_PATH=$PROJECT_PATH"
          ls -la "$GITHUB_WORKSPACE/$DEMO_DIR" || true
          mkdir -p build
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-simulator.log

      - name: Build (iOS Device, unsigned, no codesign)
        run: |
          set -euo pipefail
          PROJECT_PATH="$GITHUB_WORKSPACE/$DEMO_DIR/$PROJECT"
          echo "PROJECT_PATH=$PROJECT_PATH"
          ls -la "$GITHUB_WORKSPACE/$DEMO_DIR" || true
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-iphoneos.log

      - name: Package .ipa (Simulator + iPhoneOS unsigned)
        run: |
          set -euo pipefail
          cd "$DEMO_DIR"
          mkdir -p build

          package_ipa() {
            local app_path="$1"
            local out_ipa="$2"
            if [[ ! -d "$app_path" ]]; then
              echo "App not found at: $app_path"
              find "$DERIVED_DATA/Build/Products" -maxdepth 3 -type d -name "*.app" || true
              return 1
            fi
            rm -rf build/Payload
            mkdir -p build/Payload
            cp -R "$app_path" build/Payload/
            (cd build && /usr/bin/zip -qry "$out_ipa" Payload)
            rm -rf build/Payload
            echo "✅ Created: build/$out_ipa"
          }

          SIM_APP="$DERIVED_DATA/Build/Products/${CONFIGURATION}-iphonesimulator/HelpBotDemo.app"
          IOS_APP="$DERIVED_DATA/Build/Products/${CONFIGURATION}-iphoneos/HelpBotDemo.app"

          package_ipa "$SIM_APP" "HelpBotDemo-simulator.ipa"
          package_ipa "$IOS_APP" "HelpBotDemo-iphoneos-unsigned.ipa"

          # 统一输出文件名，方便使用方直接下载
          cp -f "build/HelpBotDemo-iphoneos-unsigned.ipa" "build/HelpBotDemo.ipa"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HelpBotDemo-${{ inputs.configuration || 'Debug' }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            SDK/iOS/HelpBotDemo/build/HelpBotDemo.ipa
            SDK/iOS/HelpBotDemo/build/HelpBotDemo-simulator.ipa
            SDK/iOS/HelpBotDemo/build/HelpBotDemo-iphoneos-unsigned.ipa
            SDK/iOS/HelpBotDemo/build/xcodebuild-simulator.log
            SDK/iOS/HelpBotDemo/build/xcodebuild-iphoneos.log


