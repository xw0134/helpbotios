name: Build iOS Demo

on:
  workflow_run:
    workflows:
      - Build iOS SDK
    types:
      - completed
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration (Debug/Release)
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release

jobs:
  build-ios-demo:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-14
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Debug' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run 事件下，默认 GITHUB_SHA 不是触发工作流的那个提交
          # 必须显式 checkout 到 SDK workflow 对应的 head_sha，保证 Demo/SDK 对齐
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.2"

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Download HelpBotSDK.xcframework artifact (from SDK workflow run)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: dawidd6/action-download-artifact@v3
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: HelpBotSDK-${{ github.event.workflow_run.head_sha }}
          path: SDK/iOS/build/_sdk_artifact

      - name: Prepare HelpBotSDK.xcframework (unzip)
        if: ${{ github.event_name == 'workflow_run' }}
        working-directory: SDK/iOS
        run: |
          set -euo pipefail
          rm -rf ./HelpBotSDK.xcframework
          unzip -q ./build/_sdk_artifact/HelpBotSDK.xcframework.zip -d .
          test -d ./HelpBotSDK.xcframework

      - name: Prepare HelpBotSDK.xcframework (manual dispatch requires local xcframework)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: SDK/iOS
        run: |
          set -euo pipefail
          test -d ./HelpBotSDK.xcframework
          echo "Using existing SDK/iOS/HelpBotSDK.xcframework (workflow_dispatch)."

      - name: Generate Xcode project (XcodeGen)
        working-directory: SDK/iOS/HelpBotDemo
        run: |
          set -euo pipefail
          xcodegen generate
          test -d ./HelpBotDemo.xcodeproj

      - name: Build Demo (simulator + archive)
        working-directory: SDK/iOS
        run: |
          set -euo pipefail
          chmod +x ./build_demo.sh
          bash ./build_demo.sh

      - name: Upload artifacts (demo archive)
        uses: actions/upload-artifact@v4
        with:
          name: HelpBotDemo-${{ env.CONFIGURATION }}-${{ github.sha }}
          path: |
            SDK/iOS/build/HelpBotDemo.xcarchive.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload artifacts (sdk from workflow_run)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/upload-artifact@v4
        with:
          name: HelpBotSDK-${{ github.event.workflow_run.head_sha }}
          path: |
            SDK/iOS/build/_sdk_artifact/HelpBotSDK.xcframework.zip
            SDK/iOS/build/_sdk_artifact/build-report.txt
          if-no-files-found: error
          retention-days: 30
