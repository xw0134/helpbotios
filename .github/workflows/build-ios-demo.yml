name: Build iOS Demo

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Debug
          - Release
  push:
    branches:
      - main
      - develop
    paths:
      - "SDK/iOS/HelpBotDemo/**"
      - "SDK/iOS/HelpBotSDK/**"
      - ".github/workflows/build-ios-demo.yml"
  pull_request:
    paths:
      - "SDK/iOS/HelpBotDemo/**"
      - "SDK/iOS/HelpBotSDK/**"
      - ".github/workflows/build-ios-demo.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔍 显示环境信息
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: 📦 安装 XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: 🔨 生成 Xcode 项目（如已提交则跳过）
        run: |
          bash SDK/iOS/generate_project.sh

      - name: 📦 解析 Swift Package 依赖
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SDK/iOS/HelpBotDemo/HelpBotDemo.xcodeproj \
            -scheme HelpBotDemo

      - name: 🔨 编译 iOS 模拟器版本
        run: |
          xcodebuild build \
            -project SDK/iOS/HelpBotDemo/HelpBotDemo.xcodeproj \
            -scheme HelpBotDemo \
            -configuration "${CONFIGURATION}" \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: 📦 Archive iOS 真机版本（CI 无签名，仅验证可编译）
        run: |
          mkdir -p SDK/iOS/HelpBotDemo/build
          xcodebuild archive \
            -project SDK/iOS/HelpBotDemo/HelpBotDemo.xcodeproj \
            -scheme HelpBotDemo \
            -configuration "${CONFIGURATION}" \
            -archivePath SDK/iOS/HelpBotDemo/build/HelpBotDemo.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: 📦 打包产物
        run: |
          cd SDK/iOS/HelpBotDemo/build
          zip -r "HelpBotDemo-${CONFIGURATION}-${GITHUB_SHA}.zip" "HelpBotDemo.xcarchive"
          ls -lh

      - name: ⬆️ 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: HelpBotDemo-${{ env.CONFIGURATION }}-${{ github.sha }}
          path: SDK/iOS/HelpBotDemo/build/HelpBotDemo-${{ env.CONFIGURATION }}-${{ github.sha }}.zip
          if-no-files-found: error
name: Build iOS Demo (IPA)
"on":
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration (Debug/Release)
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release
  push:
    paths:
      - "SDK/iOS/HelpBotDemo/**"
      - "SDK/iOS/HelpBotSDK/**"
      - ".github/workflows/build-ios-demo.yml"
  pull_request:
    paths:
      - "SDK/iOS/HelpBotDemo/**"
      - "SDK/iOS/HelpBotSDK/**"
      - ".github/workflows/build-ios-demo.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      DEMO_DIR: SDK/iOS/HelpBotDemo
      PROJECT: HelpBotDemo.xcodeproj
      SCHEME: HelpBotDemo
      CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
      DERIVED_DATA: build/DerivedData
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print toolchain versions
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "Repo root listing:"
          ls -la

      - name: Resolve SwiftPM dependencies
        working-directory: ${{ env.DEMO_DIR }}
        run: |
          set -euo pipefail
          echo "PWD=$PWD"
          echo "Listing:"
          ls -la
          if [[ ! -d "$PROJECT" ]]; then
            echo "❌ Xcode project not found: $PWD/$PROJECT"
            exit 1
          fi
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Build (iOS Simulator, no codesign)
        working-directory: ${{ env.DEMO_DIR }}
        run: |
          set -euo pipefail
          echo "PWD=$PWD"
          mkdir -p build
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-simulator.log

      - name: Build (iOS Device, unsigned, no codesign)
        working-directory: ${{ env.DEMO_DIR }}
        run: |
          set -euo pipefail
          echo "PWD=$PWD"
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-iphoneos.log

      - name: Package .ipa (Simulator + iPhoneOS unsigned)
        working-directory: ${{ env.DEMO_DIR }}
        run: |
          set -euo pipefail
          mkdir -p build

          package_ipa() {
            local app_path="$1"
            local out_ipa="$2"
            if [[ ! -d "$app_path" ]]; then
              echo "App not found at: $app_path"
              find "$DERIVED_DATA/Build/Products" -maxdepth 3 -type d -name "*.app" || true
              return 1
            fi
            rm -rf build/Payload
            mkdir -p build/Payload
            cp -R "$app_path" build/Payload/
            (cd build && /usr/bin/zip -qry "$out_ipa" Payload)
            rm -rf build/Payload
            echo "✅ Created: build/$out_ipa"
          }

          SIM_APP="$DERIVED_DATA/Build/Products/${CONFIGURATION}-iphonesimulator/HelpBotDemo.app"
          IOS_APP="$DERIVED_DATA/Build/Products/${CONFIGURATION}-iphoneos/HelpBotDemo.app"

          package_ipa "$SIM_APP" "HelpBotDemo-simulator.ipa"
          package_ipa "$IOS_APP" "HelpBotDemo-iphoneos-unsigned.ipa"

          # 统一输出文件名，方便使用方直接下载
          cp -f "build/HelpBotDemo-iphoneos-unsigned.ipa" "build/HelpBotDemo.ipa"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HelpBotDemo-${{ inputs.configuration || 'Debug' }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            SDK/iOS/HelpBotDemo/build/HelpBotDemo.ipa
            SDK/iOS/HelpBotDemo/build/HelpBotDemo-simulator.ipa
            SDK/iOS/HelpBotDemo/build/HelpBotDemo-iphoneos-unsigned.ipa
            SDK/iOS/HelpBotDemo/build/xcodebuild-simulator.log
            SDK/iOS/HelpBotDemo/build/xcodebuild-iphoneos.log


