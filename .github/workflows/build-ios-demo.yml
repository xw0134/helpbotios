name: Build iOS Demo

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration (Debug/Release)
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release
  push:
    branches:
      - main
      - develop
    paths:
      - "SDK/iOS/HelpBotDemo/**"
      - "SDK/iOS/HelpBotSDK/**"
      - "SDK/iOS/build_local.sh"
      - ".github/workflows/build-ios-demo.yml"
  pull_request:
    paths:
      - "SDK/iOS/HelpBotDemo/**"
      - "SDK/iOS/HelpBotSDK/**"
      - "SDK/iOS/build_local.sh"
      - ".github/workflows/build-ios-demo.yml"

jobs:
  build-ios-demo:
    runs-on: macos-14
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Debug' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.2"

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Verify build scripts (anti-cache / anti-old-commit)
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=${GITHUB_SHA}"
          git rev-parse HEAD
          echo "==== build_local.sh key lines (must contain DerivedData + tail -n 1 + '未找到 Swift Modules ...；请检查') ===="
          sed -n '175,215p' SDK/iOS/build_local.sh
          sed -n '270,330p' SDK/iOS/build_local.sh
          sed -n '370,410p' SDK/iOS/build_local.sh

      - name: Build HelpBotSDK.xcframework (binary delivery)
        working-directory: SDK/iOS
        run: |
          set -euo pipefail
          chmod +x ./build_local.sh
          bash ./build_local.sh
          rm -rf ./HelpBotSDK.xcframework
          unzip -q ./build/HelpBotSDK.xcframework.zip
          test -d ./HelpBotSDK.xcframework

      - name: Generate Xcode project (XcodeGen)
        working-directory: SDK/iOS/HelpBotDemo
        run: |
          set -euo pipefail
          xcodegen generate
          test -d ./HelpBotDemo.xcodeproj

      - name: Build simulator (compile verification)
        working-directory: SDK/iOS/HelpBotDemo
        run: |
          set -euo pipefail
          xcodebuild build \
            -project HelpBotDemo.xcodeproj \
            -scheme HelpBotDemo \
            -configuration "${CONFIGURATION}" \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Archive device (compile verification)
        working-directory: SDK/iOS/HelpBotDemo
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project HelpBotDemo.xcodeproj \
            -scheme HelpBotDemo \
            -configuration "${CONFIGURATION}" \
            -destination "generic/platform=iOS" \
            -archivePath ../build/HelpBotDemo.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Pack archive
        run: |
          set -euo pipefail
          cd SDK/iOS/build
          rm -f HelpBotDemo.xcarchive.zip || true
          zip -qr HelpBotDemo.xcarchive.zip HelpBotDemo.xcarchive

      - name: Upload artifacts (demo archive + sdk)
        uses: actions/upload-artifact@v4
        with:
          name: HelpBotDemo-${{ env.CONFIGURATION }}-${{ github.sha }}
          path: |
            SDK/iOS/build/HelpBotDemo.xcarchive.zip
            SDK/iOS/build/HelpBotSDK.xcframework.zip
            SDK/iOS/build/build-report.txt
          if-no-files-found: error
          retention-days: 30
