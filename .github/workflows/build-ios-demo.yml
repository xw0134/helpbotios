name: Build iOS Demo

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      build_configuration:
        description: '编译配置'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
      export_method:
        description: '导出方式'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - ad-hoc
          - app-store
  
  # 代码推送时自动触发
  push:
    branches:
      - main
      - develop
    paths:
      - 'SDK/iOS/HelpBotDemo/**'
      - 'SDK/iOS/HelpBotSDK/**'
      - '.github/workflows/build-ios-demo.yml'
  
  # PR时触发
  pull_request:
    paths:
      - 'SDK/iOS/HelpBotDemo/**'
      - 'SDK/iOS/HelpBotSDK/**'

jobs:
  build-ios-demo:
    name: 编译 iOS Demo 应用
    runs-on: macos-14
    
    env:
      DEMO_PATH: SDK/iOS/HelpBotDemo
      SCHEME: HelpBotDemo
      CONFIGURATION: ${{ github.event.inputs.build_configuration || 'Debug' }}
      EXPORT_METHOD: ${{ github.event.inputs.export_method || 'development' }}
    
    steps:
      # 1. 检出代码
      - name: 📥 检出代码
        uses: actions/checkout@v4
      
      # 2. 显示环境信息
      - name: 🔍 显示环境信息
        run: |
          echo "=== 系统信息 ==="
          sw_vers
          echo ""
          echo "=== Xcode 版本 ==="
          xcodebuild -version
          echo ""
          echo "=== Swift 版本 ==="
          swift --version
      
      # 3. 选择 Xcode 版本
      - name: ⚙️ 选择 Xcode 版本
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.2.app
          xcodebuild -version
      
      # 4. 安装 XcodeGen
      - name: 📦 安装 XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
      
      # 5. 生成 Xcode 项目
      - name: 🔨 生成 Xcode 项目
        working-directory: ${{ env.DEMO_PATH }}
        run: |
          echo "使用 XcodeGen 生成项目..."
          xcodegen generate
          echo "✅ 项目生成完成"
          ls -la
      
      # 6. 解析依赖 (Swift Package Manager)
      - name: 📦 解析 Swift Package 依赖
        working-directory: ${{ env.DEMO_PATH }}
        run: |
          echo "解析 Swift Package 依赖..."
          xcodebuild -resolvePackageDependencies \
            -project HelpBotDemo.xcodeproj \
            -scheme ${{ env.SCHEME }}
          echo "✅ 依赖解析完成"
      
      # 7. 编译 iOS 模拟器版本
      - name: 🔨 编译 iOS 模拟器版本
        working-directory: ${{ env.DEMO_PATH }}
        run: |
          echo "开始编译 iOS 模拟器版本..."
          xcodebuild build \
            -project HelpBotDemo.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
            -configuration ${{ env.CONFIGURATION }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          echo "✅ 模拟器版本编译完成"
      
      # 8. 运行测试 (可选)
      - name: 🧪 运行测试
        if: false  # 如果有测试则设为 true
        working-directory: ${{ env.DEMO_PATH }}
        run: |
          xcodebuild test \
            -project HelpBotDemo.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest"
      
      # 9. 编译真机版本 (Archive)
      - name: 🔨 编译真机版本 (Archive)
        working-directory: ${{ env.DEMO_PATH }}
        run: |
          echo "开始编译真机版本..."
          xcodebuild archive \
            -project HelpBotDemo.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -archivePath build/HelpBotDemo.xcarchive \
            -configuration ${{ env.CONFIGURATION }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          echo "✅ Archive 完成"
      
      # 10. 生成编译报告
      - name: 📄 生成编译报告
        working-directory: ${{ env.DEMO_PATH }}
        run: |
          REPORT_FILE="build/build-report.txt"
          mkdir -p build
          
          cat > "$REPORT_FILE" << EOF
          === HelpBot iOS Demo 编译报告 ===
          
          编译时间: $(date)
          编译配置: ${{ env.CONFIGURATION }}
          导出方式: ${{ env.EXPORT_METHOD }}
          Git Commit: ${{ github.sha }}
          Git Branch: ${{ github.ref_name }}
          
          === 环境信息 ===
          $(sw_vers)
          
          $(xcodebuild -version)
          
          $(swift --version)
          
          === 编译产物 ===
          $(ls -lh build/)
          
          === 项目信息 ===
          Scheme: ${{ env.SCHEME }}
          Bundle ID: com.example.helpbot.demo
          Deployment Target: iOS 13.0
          
          EOF
          
          echo "✅ 编译报告生成完成"
          cat "$REPORT_FILE"
      
      # 11. 上传编译产物
      - name: 📤 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: HelpBotDemo-${{ env.CONFIGURATION }}-${{ github.sha }}
          path: |
            ${{ env.DEMO_PATH }}/build/HelpBotDemo.xcarchive
            ${{ env.DEMO_PATH }}/build/build-report.txt
          retention-days: 30
      
      # 12. 输出总结
      - name: 📋 编译成功总结
        run: |
          echo "🎉 iOS Demo 编译成功!"
          echo ""
          echo "📦 编译产物:"
          echo "  - HelpBotDemo.xcarchive"
          echo "  - build-report.txt"
          echo ""
          echo "📥 下载方式:"
          echo "  1. 访问 Actions 页面: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "  2. 在 Artifacts 区域下载编译产物"
          echo ""
          echo "✅ 编译配置: ${{ env.CONFIGURATION }}"
          echo "✅ Git Commit: ${{ github.sha }}"
          echo ""
          echo "💡 注意: 此编译未签名,仅用于验证编译流程"
          echo "   如需真机安装,请在本地使用 Xcode 签名后安装"
