name: Build iOS Demo

on:
  workflow_run:
    workflows:
      - Build iOS SDK
    types:
      - completed
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration (Debug/Release)
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release

jobs:
  build-ios-demo:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-14
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Debug' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run 事件下，默认 GITHUB_SHA 不是触发工作流的那个提交
          # 必须显式 checkout 到 SDK workflow 对应的 head_sha，保证 Demo/SDK 对齐
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.2"

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Resolve SDK workflow run (workflow_run)
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -euo pipefail
          echo "SDK_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          echo "SDK_HEAD_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"

      - name: Resolve latest successful SDK run (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/github-script@v7
        id: resolve_sdk
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const workflow_id = 'build-ios-sdk.yml';
            const res = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id,
              branch,
              status: 'success',
              per_page: 1,
            });
            if (!res.data.workflow_runs || res.data.workflow_runs.length === 0) {
              core.setFailed(`No successful SDK workflow runs found for branch ${branch}. Please run "Build iOS SDK" first.`);
              return;
            }
            const run = res.data.workflow_runs[0];
            core.info(`Using SDK run_id=${run.id}, head_sha=${run.head_sha}`);
            core.setOutput('run_id', String(run.id));
            core.setOutput('head_sha', run.head_sha);

      - name: Export SDK run info (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          echo "SDK_RUN_ID=${{ steps.resolve_sdk.outputs.run_id }}" >> "$GITHUB_ENV"
          echo "SDK_HEAD_SHA=${{ steps.resolve_sdk.outputs.head_sha }}" >> "$GITHUB_ENV"

      - name: Download HelpBotSDK.xcframework artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          run_id: ${{ env.SDK_RUN_ID }}
          name: HelpBotSDK-${{ env.SDK_HEAD_SHA }}
          path: SDK/iOS/build/_sdk_artifact

      - name: Prepare HelpBotSDK.xcframework (unzip)
        working-directory: SDK/iOS
        run: |
          set -euo pipefail
          rm -rf ./HelpBotSDK.xcframework
          unzip -q ./build/_sdk_artifact/HelpBotSDK.xcframework.zip -d .
          test -d ./HelpBotSDK.xcframework

      - name: Verify HelpBotSDK.xcframework structure (must be importable)
        working-directory: SDK/iOS
        run: |
          set -euo pipefail
          test -f ./HelpBotSDK.xcframework/Info.plist
          test -d ./HelpBotSDK.xcframework/ios-arm64/HelpBotSDK.framework
          test -d ./HelpBotSDK.xcframework/ios-arm64_x86_64-simulator/HelpBotSDK.framework
          test -d ./HelpBotSDK.xcframework/ios-arm64/HelpBotSDK.framework/Modules/HelpBotSDK.swiftmodule
          test -d ./HelpBotSDK.xcframework/ios-arm64_x86_64-simulator/HelpBotSDK.framework/Modules/HelpBotSDK.swiftmodule
          test -f ./HelpBotSDK.xcframework/ios-arm64/HelpBotSDK.framework/Modules/module.modulemap
          test -f ./HelpBotSDK.xcframework/ios-arm64_x86_64-simulator/HelpBotSDK.framework/Modules/module.modulemap
          test -f ./HelpBotSDK.xcframework/ios-arm64/HelpBotSDK.framework/Headers/HelpBotSDK.h
          test -f ./HelpBotSDK.xcframework/ios-arm64_x86_64-simulator/HelpBotSDK.framework/Headers/HelpBotSDK.h
          echo "✅ HelpBotSDK.xcframework is ready at SDK/iOS/HelpBotSDK.xcframework"

      - name: Generate Xcode project (XcodeGen)
        working-directory: SDK/iOS/HelpBotDemo
        run: |
          set -euo pipefail
          xcodegen generate
          test -d ./HelpBotDemo.xcodeproj

      - name: Build Demo (simulator + archive)
        working-directory: SDK/iOS
        run: |
          set -euo pipefail
          chmod +x ./build_demo.sh
          bash ./build_demo.sh

      - name: Upload artifacts (demo archive)
        uses: actions/upload-artifact@v4
        with:
          name: HelpBotDemo-${{ env.CONFIGURATION }}-${{ github.sha }}
          path: |
            SDK/iOS/build/HelpBotDemo.xcarchive.zip
            SDK/iOS/build/HelpBotDemo-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload artifacts (sdk from workflow_run)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/upload-artifact@v4
        with:
          name: HelpBotSDK-${{ github.event.workflow_run.head_sha }}
          path: |
            SDK/iOS/build/_sdk_artifact/HelpBotSDK.xcframework.zip
            SDK/iOS/build/_sdk_artifact/build-report.txt
          if-no-files-found: error
          retention-days: 30
