name: HelpBotDemo

options:
  bundleIdPrefix: com.helpbot.cocos2d
  deploymentTarget:
    iOS: "12.0"
  developmentLanguage: en

settings:
  PRODUCT_NAME: HelpBotDemo
  PRODUCT_BUNDLE_IDENTIFIER: com.helpbot.cocos2d.demo
  INFOPLIST_FILE: Info.plist
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_REQUIRED: NO
  CODE_SIGNING_ALLOWED: NO
  ENABLE_BITCODE: NO
  CLANG_CXX_LANGUAGE_STANDARD: gnu++11
  CLANG_CXX_LIBRARY: libc++
  GCC_C_LANGUAGE_STANDARD: gnu11
  HEADER_SEARCH_PATHS:
    - $(inherited)
    - ../Classes
    - ../../HelpBot/include
    - D:/cocos2d/cocos
    - D:/cocos2d/cocos/platform/ios
    - D:/cocos2d/extensions
    - D:/cocos2d/external
  LIBRARY_SEARCH_PATHS:
    - $(inherited)
    - ../../HelpBot/platform/ios
  OTHER_LDFLAGS:
    - -ObjC
    - -lz
    - -lsqlite3

targets:
  HelpBotDemo:
    type: application
    platform: iOS
    
    sources:
      - path: .
        name: App
        includes:
          - "*.m"
          - "*.mm"
          - "*.h"
      - path: ../Classes
        name: Classes
        includes:
          - "*.cpp"
          - "*.h"
      - path: ../../HelpBot/include
        name: HelpBot Headers
        includes:
          - "*.h"
        type: header
      - path: ../../HelpBot/src
        name: HelpBot Sources
        includes:
          - "*.cpp"
      - path: ../../HelpBot/platform/ios
        name: HelpBot iOS
        includes:
          - "*.mm"
          - "*.h"
    
    dependencies:
      - framework: UIKit.framework
      - framework: Foundation.framework
      - framework: CoreGraphics.framework
      - framework: QuartzCore.framework
      - framework: OpenGLES.framework
      - framework: WebKit.framework
      - framework: AVFoundation.framework
      - framework: AudioToolbox.framework
      - framework: MediaPlayer.framework
      - framework: CoreMotion.framework
      - framework: GameController.framework
      - sdk: libz.tbd
      - sdk: libc++.tbd
      - sdk: libsqlite3.tbd
    
    settings:
      INFOPLIST_FILE: Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1,2"
      IPHONEOS_DEPLOYMENT_TARGET: "12.0"
    
    scheme:
      testTargets: []
      gatherCoverageData: false
